[project]
name = "logo-styler"
version = "0.1.0"
description = ""
authors = [
    {name = "ycalk (Лосев Алексей)",email = "alosev752@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standart] (>=0.141.1,<0.142.0)",
    "dishka[fastapi] (>=1.10.1,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg[binary,pool] (>=3.3.6,<4.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "opentelemetry-api (>=1.45.0,<2.0.0)",
    "opentelemetry-sdk (>=1.45.0,<2.0.0)",
    "opentelemetry-exporter-otlp (>=1.45.0,<2.0.0)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.66b0,<0.67)",
    "opentelemetry-instrumentation-fastapi (>=0.66b0,<0.67)"
]
[project.scripts]
main = 'src:main'

[tool.poetry]
packages = [
    { include = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]
